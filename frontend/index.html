<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

    <meta name="theme-color" content="#1F253A" />
    <meta name="apple-mobile-web-app-title" content="ВиКС" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <title>ВиКС</title>
    <style>
      html, body, #root { min-height: 100%; margin: 0; }
      body { background: #111827; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      #boot-fallback {
        min-height: 100vh; display: flex; flex-direction: column; align-items: center;
        justify-content: center; box-sizing: border-box; padding: 24px; color: #f8fafc;
        text-align: center;
      }
      #boot-fallback-spinner {
        width: 40px; height: 40px; margin-bottom: 20px; border: 3px solid #334155;
        border-top-color: #3b82f6; border-radius: 50%; animation: boot-spin .8s linear infinite;
      }
      #boot-fallback h1 { margin: 0 0 8px; font-size: 20px; }
      #boot-fallback p { max-width: 340px; margin: 0; color: #94a3b8; font-size: 14px; line-height: 1.5; }
      #boot-retry {
        display: none; margin-top: 20px; padding: 12px 18px; border: 0; border-radius: 12px;
        background: #2563eb; color: #fff; font-size: 14px; font-weight: 700;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot-fallback" role="status" aria-live="polite">
        <div id="boot-fallback-spinner"></div>
        <h1 id="boot-title">Запуск приложения</h1>
        <p id="boot-message">Загружаем файлы приложения…</p>
        <button id="boot-retry" type="button">Повторить загрузку</button>
      </div>
    </div>
    <script>
      (function () {
        var recoveryKey = 'viks_boot_recovery_count';
        var recovering = false;
        var stableTimer = null;
        window.__VIKS_BOOTED__ = false;
        window.__VIKS_BOOT_STAGE__ = 'html-ready';
        window.__VIKS_BOOT_FAILURE__ = null;

        function resourceName(value) {
          if (!value) return '';
          try {
            var pathname = new URL(String(value), location.href).pathname;
            return pathname.split('/').filter(Boolean).pop() || pathname;
          } catch (_) {
            return String(value).slice(0, 80);
          }
        }

        function rememberFailure(reason, resource, message) {
          window.__VIKS_BOOT_STAGE__ = reason;
          window.__VIKS_BOOT_FAILURE__ = {
            reason: reason,
            resource: resourceName(resource),
            message: String(message || '').slice(0, 120)
          };
        }

        function getAttempts() {
          try { return parseInt(sessionStorage.getItem(recoveryKey) || '0', 10) || 0; }
          catch (_) { return 0; }
        }

        function setAttempts(value) {
          try { sessionStorage.setItem(recoveryKey, String(value)); } catch (_) { /* private mode */ }
        }

        function showManualRetry(reason) {
          var spinner = document.getElementById('boot-fallback-spinner');
          var title = document.getElementById('boot-title');
          var message = document.getElementById('boot-message');
          var button = document.getElementById('boot-retry');
          var failure = window.__VIKS_BOOT_FAILURE__;
          var detail = failure && failure.resource ? ' Не загрузился файл: ' + failure.resource + '.' : '';
          if (spinner) spinner.style.display = 'none';
          if (title) title.textContent = 'Не удалось запустить приложение';
          if (message) message.textContent = reason === 'startup-timeout'
            ? 'Не завершилась загрузка файлов интерфейса. Проверьте соединение и повторите попытку.' + detail
            : 'Один из файлов интерфейса не загрузился.' + detail + ' Повторите попытку.';
          if (button) button.style.display = 'block';
        }

        function reloadFresh() {
          try {
            var url = new URL(location.href);
            url.searchParams.set('recovered', String(Date.now()));
            location.replace(url.href);
          } catch (_) {
            location.replace(location.pathname + '?recovered=' + Date.now() + location.hash);
          }
        }

        function recover(reason, force) {
          if (recovering) return;
          var attempts = getAttempts();

          // A slow mobile connection is not an update. Never reload merely
          // because the boot timer elapsed: that was the source of the
          // endless-update loop on iPhone. A concrete missing script/chunk may
          // be recovered automatically once; every later retry is manual.
          var automatic = !force && reason !== 'startup-timeout' && attempts < 1;
          if (!force && !automatic) {
            showManualRetry(reason);
            return;
          }
          recovering = true;
          setAttempts(attempts + 1);

          var title = document.getElementById('boot-title');
          var message = document.getElementById('boot-message');
          if (title) title.textContent = 'Повторяем загрузку';
          if (message) message.textContent = 'Обновляем локальные файлы. Страница откроется автоматически.';

          var cleanupTasks = [];
          try {
            if ('caches' in window) {
              cleanupTasks.push(caches.keys().then(function (names) {
                return Promise.all(names.filter(function (name) {
                  return name !== 'viks-auth-v1';
                }).map(function (name) { return caches.delete(name); }));
              }).catch(function () {}));
            }
          } catch (_) { /* cache API may be blocked */ }

          Promise.all(cleanupTasks).then(function () {
            setTimeout(reloadFresh, 250);
          }).catch(function () {
            setTimeout(reloadFresh, 250);
          });
          try { console.warn('[boot] recovery:', reason); } catch (_) { /* silent */ }
        }

        window.__VIKS_RECOVER__ = recover;
        window.addEventListener('viks:booted', function () {
          window.__VIKS_BOOTED__ = true;
          window.__VIKS_BOOT_STAGE__ = 'react-mounted';
          window.__VIKS_BOOT_FAILURE__ = null;
          // Keep the recovery guard for a short stability window. React can
          // mount before a lazy route finishes downloading; resetting here
          // immediately allowed a failing chunk to trigger an endless reload.
          if (stableTimer) clearTimeout(stableTimer);
          stableTimer = setTimeout(function () { setAttempts(0); }, 10000);
        });
        window.addEventListener('vite:preloadError', function (event) {
          if (event && event.preventDefault) event.preventDefault();
          rememberFailure('preload-error', '', event && event.payload && event.payload.message);
          recover('preload-error');
        });
        window.addEventListener('error', function (event) {
          var target = event && event.target;
          var linkRel = target && target.getAttribute ? target.getAttribute('rel') : '';
          var sourceFailed = target && (target.tagName === 'SCRIPT' ||
            (target.tagName === 'LINK' && (linkRel === 'stylesheet' || linkRel === 'modulepreload')));
          var message = String((event && event.message) || '');
          if (sourceFailed || /module|script|syntax/i.test(message)) {
            rememberFailure('resource-error', target && (target.src || target.href), message);
            recover('resource-error');
          }
        }, true);
        window.addEventListener('unhandledrejection', function (event) {
          var message = String((event && event.reason && (event.reason.message || event.reason)) || '');
          if (/dynamic import|failed to fetch|module/i.test(message)) {
            rememberFailure('module-rejection', '', message);
            recover('module-rejection');
          }
        });

        var retry = document.getElementById('boot-retry');
        if (retry) retry.onclick = function () { recovering = false; recover('manual', true); };
        setTimeout(function () {
          if (!window.__VIKS_BOOTED__) {
            if (!window.__VIKS_BOOT_FAILURE__) rememberFailure('startup-timeout', '', 'React did not mount');
            recover('startup-timeout');
          }
        }, 20000);
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
